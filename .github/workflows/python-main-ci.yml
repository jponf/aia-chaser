name: Python Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/python-lint.yml

  build:
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # macOS: only test 3.12 and 3.15
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          # Windows: only test 3.12 and 3.15
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python for Poetry
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        shell: bash
        run: |
          pip install --user pipx
          pipx ensurepath
          pipx install "poetry>=2"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          poetry install --with dev --with test
      - name: Verify Poetry Python
        shell: bash
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          poetry env info --executable
          poetry run python - <<'PY'
          import os
          import sys

          expected = tuple(
              map(int, os.environ["EXPECTED_PYTHON_VERSION"].split(".")),
          )
          assert sys.version_info[:2] == expected, (
              f"Expected Python {expected}, got {sys.version}"
          )
          PY
      - name: Test with pytest and coverage
        run: poetry run pytest -s --cov=aia_chaser --cov-report=term-missing
